name: Anylinux AppImage Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: appimage-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      commit: ${{ steps.package.outputs.commit }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - name: Set up Anylinux tools
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd
      - name: Install dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            base-devel git meson ninja vala gtk4 libadwaita libsoup3 libsecret \
            glib-networking ca-certificates adwaita-icon-theme hicolor-icon-theme \
            xorg-server-xvfb xorg-xauth dbus jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile, test and package x86_64
        id: package
        env:
          ALWAYS_SOFTWARE: "1"
          # Contacts displays still photos and does not use GTK media playback.
          DEPLOY_GSTREAMER: "0"
        run: |
          set -eu
          ARCH=$(uname -m)
          if [ "$ARCH" != x86_64 ]; then
              echo "This workflow targets x86_64." >&2
              exit 1
          fi
          commit=$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          trap 'exit 1' HUP INT TERM

          meson setup "$scratch/build" "$GITHUB_WORKSPACE" --prefix=/usr --buildtype=release
          meson compile -C "$scratch/build"
          meson test -C "$scratch/build" --print-errorlogs
          DESTDIR="$scratch/install" meson install -C "$scratch/build"

          cd "$scratch"
          VERSION=$(meson introspect --projectinfo "$scratch/build" | jq -er .version)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              printf 'Tag %s must match Meson version v%s.\n' "$GITHUB_REF_NAME" "$VERSION" >&2
              exit 1
          fi
          OUTPATH="$scratch/dist"
          mkdir -p "$OUTPATH"
          app_id=io.github.StandaloneContacts
          ICON="$scratch/install/usr/share/icons/hicolor/scalable/apps/$app_id.svg"
          DESKTOP="$scratch/install/usr/share/applications/$app_id.desktop"
          DEPLOY_GTK=1
          GTK_DIR=gtk-4.0
          GTK_CLASS_FIX=1
          STARTUPWMCLASS="$app_id"
          STRACE_BINARY=standalone-contacts
          STRACE_FLAGS=--smoke-test
          export ARCH VERSION OUTPATH ICON DESKTOP DEPLOY_GTK GTK_DIR GTK_CLASS_FIX STARTUPWMCLASS
          export STRACE_BINARY STRACE_FLAGS

          # The TLS provider is loaded by GIO at runtime and is absent from the linker's dependency graph.
          XDG_DATA_HOME="$scratch/trace-data" GTK_A11Y=none GSK_RENDERER=cairo GDK_DISABLE=gl,vulkan \
              dbus-run-session -- xvfb-run -a quick-sharun \
              "$scratch/install/usr/bin/standalone-contacts" /usr/lib/gio/modules/libgiognutls.so
          mesa_driver=$(find AppDir \( -name 'libgallium*.so*' -o -name '*_dri.so' \
              -o -name 'libGLX_mesa.so*' -o -name 'libEGL_mesa.so*' \) -print -quit)
          if [ -n "$mesa_driver" ]; then
              printf 'Unexpected Mesa driver in AppDir: %s\n' "$mesa_driver" >&2
              exit 1
          fi
          quick-sharun --make-appimage
          set -- "$OUTPATH"/*.AppImage
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one AppImage in $OUTPATH." >&2
              exit 1
          fi
          image=$1
          du -h "$image"
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --version
          export APPIMAGE_EXTRACT_AND_RUN=1 GTK_A11Y=none
          export XDG_DATA_HOME="$scratch/test-data"
          timeout 90 dbus-run-session -- xvfb-run -a "$image" --smoke-test
          destination="$GITHUB_WORKSPACE/dist"
          mkdir -p "$destination"
          install -m 0755 "$image" "$destination/Contacts-$VERSION-$ARCH.AppImage"
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$commit" >> "$GITHUB_OUTPUT"
      - name: Pass AppImage to release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 1
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-appimage
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -eu
          tag="v$VERSION"
          image="dist/Contacts-$VERSION-x86_64.AppImage"
          test -s "$image"

          # Create the tag for a manual run. Verify the commit before publishing either way.
          if ! gh api "repos/$GH_REPO/commits/$tag" --jq .sha > tag-commit.txt; then
              gh api --method POST "repos/$GH_REPO/git/refs" \
                  -f "ref=refs/tags/$tag" -f "sha=$BUILD_COMMIT" >/dev/null
              gh api "repos/$GH_REPO/commits/$tag" --jq .sha > tag-commit.txt
          fi
          if [ "$(cat tag-commit.txt)" != "$BUILD_COMMIT" ]; then
              printf 'Tag %s already points to a different commit. Bump the version in meson.build.\n' "$tag" >&2
              exit 1
          fi

          if gh release view "$tag" --json assets,isDraft > release.json; then
              if ! jq -e --arg asset "$(basename "$image")" \
                  '.assets | any(.name == $asset)' release.json >/dev/null; then
                  gh release upload "$tag" "$image"
              fi
              if jq -e '.isDraft' release.json >/dev/null; then
                  gh release edit "$tag" --draft=false
              fi
          else
              gh release create "$tag" "$image" --verify-tag \
                --title "Contacts $tag" --generate-notes
          fi
